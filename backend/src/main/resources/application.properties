spring.application.name=suraksha-cover

# --- Database (set these via environment variables — see .env.example) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/suraksha_cover}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:5000}
server.servlet.context-path=/api

# --- JWT ---
app.jwt.secret=${JWT_SECRET:change_this_to_a_long_random_string}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# --- CORS ---
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- File uploads ---
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- OTP delivery ---
app.brevo.api-key=${BREVO_API_KEY:}
app.twofactor.api-key=${TWOFACTOR_API_KEY:}

# --- Swagger ---
springdoc.swagger-ui.path=/docs

# --- Demo data seeding (set true once via env var to populate demo accounts) ---
app.seed.enabled=${SEED_ENABLED:false}
